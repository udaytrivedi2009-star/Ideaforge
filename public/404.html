<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 - Page Not Found | Ideaforge</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #1d5a9c;
        color: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 50% 0%, rgba(140, 186, 229, 0.42), transparent 34rem),
          linear-gradient(135deg, #1d5a9c 0%, #2870c0 48%, #1e3a8a 100%);
      }

      main {
        width: min(100%, 560px);
        text-align: center;
      }

      .mark {
        display: inline-grid;
        place-items: center;
        width: 64px;
        height: 64px;
        margin-bottom: 24px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.12);
        font-size: 30px;
        font-weight: 900;
      }

      h1 {
        margin: 0;
        font-size: clamp(4rem, 20vw, 8rem);
        line-height: 0.9;
        letter-spacing: 0;
      }

      h2 {
        margin: 20px 0 10px;
        font-size: clamp(1.75rem, 6vw, 2.75rem);
        line-height: 1.05;
      }

      p {
        margin: 0 auto 28px;
        max-width: 34rem;
        color: rgba(255, 255, 255, 0.82);
        font-size: 1rem;
        line-height: 1.65;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 22px;
        border-radius: 12px;
        background: #ffffff;
        color: #1d5a9c;
        font-weight: 800;
        text-decoration: none;
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.18);
      }

      a:focus-visible {
        outline: 3px solid rgba(255, 255, 255, 0.7);
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">!</div>
      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>
        The Ideaforge page you are looking for does not exist, has been moved, or the link is no
        longer available.
      </p>
      <a href="/">Return to Homepage</a>
    </main>
  </body>
</html>
