<svg width="1400" height="640" viewBox="0 0 1400 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1400" height="640" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="700" y="48" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1A1A18">Startup Idea Validation Platform — Page Structure</text>
  <text x="700" y="76" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#5F5E5A">User journey from landing page to community engagement</text>

  <!-- Phase labels -->
  <text x="190" y="120" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#5F5E5A" letter-spacing="0.5">ENTRY</text>
  <text x="570" y="120" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#185FA5" letter-spacing="0.5">CORE VALIDATION LOOP</text>
  <text x="1030" y="120" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#993C1D" letter-spacing="0.5">COMMUNITY &amp; ACCOUNT</text>
  <text x="1300" y="120" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#5F5E5A" letter-spacing="0.5">SUPPORT</text>

  <!-- phase divider lines -->
  <line x1="370" y1="100" x2="370" y2="560" stroke="#E5E3DA" stroke-width="1"/>
  <line x1="850" y1="100" x2="850" y2="560" stroke="#E5E3DA" stroke-width="1"/>
  <line x1="1190" y1="100" x2="1190" y2="560" stroke="#E5E3DA" stroke-width="1"/>

  <!-- Row of boxes (horizontal flow) -->
  <!-- Box template: 150x100 -->

  <!-- 1. Landing -->
  <g>
    <rect x="40" y="160" width="150" height="100" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
    <text x="115" y="195" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">1. Landing page</text>
    <text x="115" y="215" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5F5E5A">Pitch &amp; value</text>
    <text x="115" y="231" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5F5E5A">proposition</text>
  </g>

  <!-- 2. Auth -->
  <g>
    <rect x="240" y="160" width="150" height="100" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
    <text x="315" y="195" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">2. Sign up / login</text>
    <text x="315" y="215" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5F5E5A">Account</text>
    <text x="315" y="231" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5F5E5A">creation</text>
  </g>

  <!-- 3. Dashboard -->
  <g>
    <rect x="420" y="160" width="150" height="100" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
    <text x="495" y="195" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0C447C">3. Dashboard</text>
    <text x="495" y="215" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#185FA5">My ideas</text>
    <text x="495" y="231" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#185FA5">overview</text>
  </g>

  <!-- 4. Submit -->
  <g>
    <rect x="620" y="160" width="150" height="100" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
    <text x="695" y="195" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0C447C">4. Submit idea</text>
    <text x="695" y="215" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#185FA5">Idea input</text>
    <text x="695" y="231" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#185FA5">form</text>
  </g>

  <!-- 5. Analyzing -->
  <g>
    <rect x="820" y="160" width="150" height="100" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
    <text x="895" y="195" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0C447C">5. AI analyzing</text>
    <text x="895" y="215" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#185FA5">Processing</text>
    <text x="895" y="231" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#185FA5">state</text>
  </g>

  <!-- 6. Results -->
  <g>
    <rect x="1020" y="160" width="150" height="100" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="2"/>
    <text x="1095" y="190" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0C447C">6. Idea results</text>
    <text x="1095" y="210" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#185FA5">SWOT, market</text>
    <text x="1095" y="226" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#185FA5">size, competitors</text>
  </g>

  <!-- Arrows row 1 -->
  <line x1="190" y1="210" x2="232" y2="210" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="210" x2="412" y2="210" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="210" x2="612" y2="210" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="770" y1="210" x2="812" y2="210" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="970" y1="210" x2="1012" y2="210" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Drop down from Results to row 2 (continues to community) -->
  <path d="M1095 260 L1095 300 L1095 320" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 2 -->

  <!-- 7. Community feed -->
  <g>
    <rect x="1020" y="380" width="150" height="100" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
    <text x="1095" y="415" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#993C1D">7. Community</text>
    <text x="1095" y="435" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#993C1D">feed — browse</text>
    <text x="1095" y="451" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#993C1D">&amp; vote</text>
  </g>

  <!-- 8. Idea detail -->
  <g>
    <rect x="820" y="380" width="150" height="100" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
    <text x="895" y="415" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#993C1D">8. Idea detail</text>
    <text x="895" y="435" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#993C1D">Comments &amp;</text>
    <text x="895" y="451" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#993C1D">discussion</text>
  </g>

  <!-- 9. Profile -->
  <g>
    <rect x="620" y="380" width="150" height="100" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
    <text x="695" y="415" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#993C1D">9. Profile</text>
    <text x="695" y="435" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#993C1D">My ideas,</text>
    <text x="695" y="451" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#993C1D">votes, settings</text>
  </g>

  <!-- 10. About / contact -->
  <g>
    <rect x="1240" y="380" width="140" height="100" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
    <text x="1310" y="415" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">10. About /</text>
    <text x="1310" y="433" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">contact</text>
    <text x="1310" y="453" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5F5E5A">Static pages</text>
  </g>

  <!-- Arrows row 2 (right to left, continuing the journey) -->
  <line x1="1020" y1="430" x2="978" y2="430" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="820" y1="430" x2="778" y2="430" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1170" y1="430" x2="1232" y2="430" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <g>
    <rect x="40" y="560" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
    <text x="62" y="571" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">Entry / static pages</text>

    <rect x="220" y="560" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
    <text x="242" y="571" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">Core validation loop (build first)</text>

    <rect x="470" y="560" width="14" height="14" rx="3" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
    <text x="492" y="571" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A">Community &amp; account (phase 2)</text>
  </g>

  <text x="40" y="610" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#888780">Bold box = highest-priority page for demo / portfolio review</text>
</svg>
